# Деплой на сервер openline (так же, как портфолио Arelman/portfolio).
# Repository settings → Secrets and variables → Actions → Variables: CD_SERVER = https://deploy.openline.one
# Владелец сервера один раз разрешает проект:
#   sudo cdctl project add design-course --repo Arelman/design-course --type static --domain <домен>
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [deploy, status, logs, rollback]
        default: deploy

permissions:
  contents: read
  id-token: write # the OIDC token is the only credential

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # статический сайт без сборки: сервер отдаёт файлы из корня репозитория
      - uses: Dmitry-Fedotov-Dev/cd@v1
        with:
          server: ${{ vars.CD_SERVER }}
          project: design-course
          action: ${{ inputs.action || 'deploy' }}
